services:
  rclone-gui:
    build: .
    ports:
      # Published on loopback by default. Set BIND_ADDRESS=0.0.0.0 in .env to
      # reach it from other machines (you will be asked to set a password on
      # first visit; see AUTH_MODE).
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    volumes:
      # Persist SQLite database
      - ./data:/app/instance
      # Mount your rclone config (remotes are defined here)
      - ${RCLONE_CONFIG:-~/.config/rclone}:/root/.config/rclone
      # Mount the data you want to back up or restore (read-write!)
      - ${DATA_PATH:-/mnt/storage}:/mnt/:rw
    environment:
      # Optional: generated once and kept in ./data when empty.
      - SECRET_KEY=${SECRET_KEY:-}
      # password (default) | proxy | none. See .env.example.
      - AUTH_MODE=${AUTH_MODE:-password}
      - AUTH_PROXY_HEADER=${AUTH_PROXY_HEADER:-Remote-User}
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
      - TIMEZONE=${TIMEZONE:-UTC}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - RCLONE_RC_URL=http://127.0.0.1:5572
    restart: unless-stopped
