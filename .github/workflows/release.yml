name: Release

on:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-desktop.txt
      - run: pytest
      - run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: ./packaging/build.ps1 -Version "$("${{ github.ref_name }}".TrimStart('v'))"
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/rClone-GUI-Setup.exe --draft --generate-notes
